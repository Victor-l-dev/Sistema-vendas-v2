<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Novo Pedido</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Sistema de Vendas</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/clientes}">Clientes</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/produtos}">Produtos</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/pedidos}">Pedidos</a></li>
                <li class="nav-item ms-lg-3"><span class="navbar-text usuario-logado" sec:authentication="principal.nome">Usuário</span></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/logout}">Sair</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h4 class="mb-0 text-dark">Novo Pedido</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/pedidos/novo}" method="post">
                        <div class="mb-3">
                            <label for="clienteId" class="form-label">Cliente</label>
                            <select id="clienteId" name="clienteId" class="form-select" required>
                                <option value="" disabled selected>Selecione um cliente</option>
                                <option th:each="cliente : ${clientes}" 
                                        th:value="${cliente.id}" 
                                        th:text="${cliente.nomeCompleto}"></option>
                            </select>
                        </div>
                        
                        <div class="d-flex justify-content-end mt-4">
                            <a th:href="@{/pedidos}" class="btn btn-outline-secondary me-2">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Criar Pedido</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
