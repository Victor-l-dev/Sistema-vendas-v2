<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Listagem de Produtos</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Sistema de Vendas</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/clientes}">Clientes</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link active" th:href="@{/produtos}">Produtos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/pedidos}">Pedidos</a></li>
                <li class="nav-item ms-lg-3"><span class="navbar-text usuario-logado" sec:authentication="principal.nome">Usuário</span></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/logout}">Sair</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mb-5">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
            <h4 class="mb-0 text-dark">Produtos</h4>
            <a class="btn btn-primary" th:href="@{/produtos/novo}">+ Novo Produto</a>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-3">Nome</th>
                            <th>Descrição</th>
                            <th>Preço</th>
                            <th class="text-center">Quantidade em Estoque</th>
                            <th class="text-center pe-3">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="produto : ${produtos}">
                            <td class="ps-3 fw-medium" th:text="${produto.nome}"></td>
                            <td class="text-muted" th:text="${produto.descricao}"></td>
                            <td>R$ <span th:text="${produto.preco}"></span></td>
                            <td class="text-center">
                                <span class="badge rounded-pill" th:classappend="${produto.quantidadeEmEstoque > 0 ? 'bg-success' : 'bg-danger'}" th:text="${produto.quantidadeEmEstoque}"></span>
                            </td>
                            <td class="text-center pe-3">
                                <a class="btn btn-sm btn-outline-secondary me-1" th:href="@{/produtos/edit/{id}(id=${produto.id})}">Editar</a>
                                <a class="btn btn-sm btn-outline-danger" th:href="@{/produtos/delete/{id}(id=${produto.id})}">Excluir</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(produtos)}">
                            <td colspan="5" class="text-center py-5 text-muted">Nenhum produto encontrado.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
