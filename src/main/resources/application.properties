spring.application.name=sistema-de-vendas
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sistema_vendas}
spring.datasource.username=${DB_USER:usuario}
spring.datasource.password=${DB_PASSWORD:senha123}

server.port=${PORT:8080}

# Usuários de teste criados na primeira execução (senhas gravadas com BCrypt)
app.usuarios.admin.email=${ADMIN_EMAIL:admin@vendas.com}
app.usuarios.admin.senha=${ADMIN_PASSWORD:admin123}
app.usuarios.padrao.email=${PADRAO_EMAIL:padrao@vendas.com}
app.usuarios.padrao.senha=${PADRAO_PASSWORD:padrao123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
